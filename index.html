<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — theme-aware -->
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/logo/clearwork_symbol_dark.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)"  href="/logo/clearwork_symbol_white.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />

    <!-- SEO -->
    <title>Clinekt — Proposals. Contracts. Invoices. All connected.</title>
    <meta name="description" content="Clinekt — India's all-in-one client workflow. Proposals, contracts, GST invoices, and Razorpay payments in one tool. Built for Indian freelancers and agencies." />
    <link rel="canonical" href="https://clinekt.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clinekt.io/" />
    <meta property="og:title" content="Clinekt — Run your entire freelance business on one platform" />
    <meta property="og:description" content="GST invoices, e-signed contracts, UPI payments, WhatsApp reminders — all in one place. Built for Indian freelancers." />
    <meta property="og:image" content="https://clinekt.io/og-image.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clinekt — Run your entire freelance business on one platform" />
    <meta name="twitter:description" content="GST invoices, e-signed contracts, UPI payments, WhatsApp reminders — all in one place." />
    <meta name="twitter:image" content="https://clinekt.io/og-image.png" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Clinekt",
      "url": "https://clinekt.io",
      "logo": "https://clinekt.io/logo/full_logo.svg",
      "description": "India's all-in-one client workflow for freelancers and agencies. Proposals, contracts, GST invoices, and Razorpay payments in one platform.",
      "address": { "@type": "PostalAddress", "addressCountry": "IN" }
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Clinekt",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "Run your entire freelance business on one platform — GST invoices, e-signed contracts, UPI payments, WhatsApp reminders.",
      "url": "https://clinekt.io",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR",
        "description": "Free forever plan available. Paid plans start at ₹699/month."
      },
      "audience": { "@type": "Audience", "audienceType": "Indian freelancers and agencies" }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
