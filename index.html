<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — SVG handles dark/light via CSS media query inside the SVG; ICO fallback for old browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />

    <!-- SEO -->
    <title>ClearWork — GST Invoices, Contracts &amp; Proposals for Indian Freelancers</title>
    <meta name="description" content="ClearWork — India's all-in-one client workflow. GST invoices, e-signed contracts, Razorpay payments, and proposals in one tool. Built for Indian freelancers and agencies." />
    <meta name="keywords" content="GST invoice generator India, freelance contract India, TDS calculator freelancer, e-sign contract India, GST calculator CGST SGST, income tax calculator FY 2025-26, invoice generator free India, freelance tools India" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClearWork — GST Invoices, Contracts &amp; Proposals for Indian Freelancers" />
    <meta property="og:description" content="GST invoices, e-signed contracts, UPI payments, WhatsApp reminders — all in one place. Built for Indian freelancers." />
    <meta property="og:image" content="https://getclearwork.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ClearWork" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@getclearwork" />
    <meta name="twitter:creator" content="@getclearwork" />
    <meta name="twitter:title" content="ClearWork — GST Invoices, Contracts &amp; Proposals for Indian Freelancers" />
    <meta name="twitter:description" content="GST invoices, e-signed contracts, UPI payments, WhatsApp reminders — all in one place." />
    <meta name="twitter:image" content="https://getclearwork.in/og-image.png" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ClearWork",
      "url": "https://getclearwork.in",
      "logo": {
        "@type": "ImageObject",
        "url": "https://getclearwork.in/logo/full_logo.svg",
        "width": 200,
        "height": 60
      },
      "description": "India's all-in-one client workflow for freelancers and agencies. Proposals, contracts, GST invoices, and Razorpay payments in one platform.",
      "foundingDate": "2025",
      "foundingLocation": {
        "@type": "Place",
        "addressCountry": "IN",
        "addressLocality": "Bengaluru"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN",
        "addressLocality": "Bengaluru",
        "addressRegion": "Karnataka"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@getclearwork.in",
        "availableLanguage": ["English", "Hindi"]
      },
      "knowsAbout": [
        "GST invoicing India",
        "Freelancer client management",
        "E-sign contracts IT Act 2000",
        "UPI payment integration",
        "TDS tracking India"
      ],
      "sameAs": [
        "https://twitter.com/getclearwork",
        "https://www.linkedin.com/company/clearwork-india",
        "https://www.producthunt.com/products/clearwork"
      ]
    }
    </script>

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ClearWork",
      "url": "https://getclearwork.in",
      "description": "Free tools for Indian freelancers: GST invoice generator, freelance contract generator, TDS calculator, income tax calculator, quote generator and more.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://getclearwork.in/tools?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ClearWork",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Client Management Software",
      "operatingSystem": "Web, iOS, Android",
      "description": "Run your entire freelance business on one platform — GST invoices, e-signed contracts, UPI payments, WhatsApp reminders. Built for Indian freelancers and agencies.",
      "url": "https://getclearwork.in",
      "inLanguage": "en-IN",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free Plan",
          "price": "0",
          "priceCurrency": "INR",
          "description": "3 projects, 3 proposals/month, basic invoicing. No credit card required."
        },
        {
          "@type": "Offer",
          "name": "Solo Plan",
          "price": "149",
          "priceCurrency": "INR",
          "description": "Unlimited leads, proposals, contracts, GST invoicing, UPI payments. Founding price."
        },
        {
          "@type": "Offer",
          "name": "Studio Plan",
          "price": "349",
          "priceCurrency": "INR",
          "description": "Everything in Solo plus team seats and multi-currency. Founding price."
        }
      ],
      "featureList": [
        "GST invoice generator with CGST/SGST/IGST auto-calculation",
        "UPI payment links in invoices via Razorpay",
        "OTP e-sign contracts valid under IT Act 2000",
        "Proposal tracking with open notifications",
        "WhatsApp invoice reminders at 3, 7, 14 days overdue",
        "TDS tracking Section 194J and 194C",
        "Client CRM with lead pipeline",
        "Client portal",
        "AI proposal drafter"
      ],
      "audience": { "@type": "Audience", "audienceType": "Indian freelancers, consultants, and creative agencies" }
    }
    </script>

    <!-- Trustpilot: invitation API — sends review request emails after key actions -->

      var a=d.createElement(s);a.async=1;a.src=r;a.type='text/javascript';var f=d.getElementsByTagName(s)[0];
      f.parentNode.insertBefore(a,f)})(window,document,'script','https://invitejs.trustpilot.com/tp.min.js','tp');
      tp('register', 'rM3xtn4vbvFIHsrX');
    </script>
    <!-- Trustpilot: TrustBox widget bootstrap — renders review collector widgets -->
    <script type="text/javascript" src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>

    <!-- Preload hero image for LCP -->
    <link rel="preload" as="image" href="/screenshots/screenshot-dashboard.png" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
