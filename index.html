<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — SVG handles dark/light via CSS media query inside the SVG; ICO fallback for old browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />

    <!-- SEO -->
    <title>ClearWork — GST Invoices, Contracts &amp; Proposals for Indian Freelancers</title>
    <meta name="description" content="ClearWork — India's all-in-one client workflow. GST invoices, e-signed contracts, Razorpay payments, and proposals in one tool. Built for Indian freelancers and agencies." />
    <link rel="canonical" href="https://getclearwork.in/" />
    <meta name="keywords" content="GST invoice generator India, freelance contract India, TDS calculator freelancer, e-sign contract India, GST calculator CGST SGST, income tax calculator FY 2025-26, invoice generator free India, freelance tools India" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getclearwork.in/" />
    <meta property="og:title" content="ClearWork — GST Invoices, Contracts &amp; Proposals for Indian Freelancers" />
    <meta property="og:description" content="GST invoices, e-signed contracts, UPI payments, WhatsApp reminders — all in one place. Built for Indian freelancers." />
    <meta property="og:image" content="https://getclearwork.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ClearWork" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@getclearwork" />
    <meta name="twitter:creator" content="@getclearwork" />
    <meta name="twitter:title" content="ClearWork — GST Invoices, Contracts &amp; Proposals for Indian Freelancers" />
    <meta name="twitter:description" content="GST invoices, e-signed contracts, UPI payments, WhatsApp reminders — all in one place." />
    <meta name="twitter:image" content="https://getclearwork.in/og-image.png" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ClearWork",
      "url": "https://getclearwork.in",
      "logo": {
        "@type": "ImageObject",
        "url": "https://getclearwork.in/logo/full_logo.svg",
        "width": 200,
        "height": 60
      },
      "description": "India's all-in-one client workflow for freelancers and agencies. Proposals, contracts, GST invoices, and Razorpay payments in one platform.",
      "address": { "@type": "PostalAddress", "addressCountry": "IN" },
      "sameAs": [
        "https://twitter.com/getclearwork",
        "https://www.linkedin.com/company/clearwork-india",
        "https://www.producthunt.com/products/clearwork",
        "https://www.indiegogo.com"
      ]
    }
    </script>

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ClearWork",
      "url": "https://getclearwork.in",
      "description": "Free tools for Indian freelancers: GST invoice generator, freelance contract generator, TDS calculator, income tax calculator, quote generator and more.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://getclearwork.in/tools?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ClearWork",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "Run your entire freelance business on one platform — GST invoices, e-signed contracts, UPI payments, WhatsApp reminders.",
      "url": "https://getclearwork.in",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR",
        "description": "Free forever plan available. Paid plans start at ₹699/month."
      },
      "audience": { "@type": "Audience", "audienceType": "Indian freelancers and agencies" }
    }
    </script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NEGSZC249H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NEGSZC249H', { send_page_view: false });
    </script>

    <!-- Preload hero image for LCP -->
    <link rel="preload" as="image" href="/screenshots/screenshot-dashboard.png" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
